<!doctype html>
<html>
<head>
	<title>Ardnilak Foundation Contact Page</title>
	<link rel="stylesheet" href="ard_style.css">
	<link rel="icon" type="image/png" sizes="48x48" href="ardnilak_logo.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
</head>

<body>

	<header class="ard-header">
		<div class="container-fluid">
			<nav class="ard-main-nav">
				<a href="index.html"><img class="logo" src="ardnilak_logo.png" alt="Ardnilak Logo"></a>
				<ul>
					<li><button type="button" class="btn btn-secondary"><a href="ardnilak_contact.html">Contact</a></button></li>
					<li><button type ="button" class="btn btn-primary"><a href="https://www.zeffy.com/en-US/donation-form/thank-you-for-your-donation-20" target="_blank">Donate</a></button></li>
				</ul>
			</nav>
		</div>
	</header>

	<div class="ard-contact-header">
		<div class="container-fluid">
			<h1>Send Us a Message!</h1>
		</div>
	</div>

	<div class="ard-contact-form">
		<div class="container-fluid">
			<form class="row g-3" action="https://formsubmit.co/4e323b2116136c9280bb1a6eba5a6334" method="POST">
				<!--Honeypot-->
				<input type="text" name="_honey" style="display:none;">

				<!--Disable Captcha-->
				<input type="hidden" name="_captcha" value="false">

				<!--Send to success page-->
				<input type="hidden" name="_next" value="https://nathankafe.github.io/ardnliakfoundation/success.html">

				<div class="col-md-6">
					<label for="firstName" class="form-label">First Name *</label>
					<input type="text" class="form-control" name="name" id="firstName" required>
				</div><!--end of firstName-->

				<div class="col-md-6">
					<label for="lastName" class="form-label">Last Name *</label>
					<input type="text" class="form-control" name="Last&nbsp;Name"id="lastName" required>
				</div><!--end of lastName-->

				<div class="col-md-8">
					<label for="emailInfo" class="form-label">Email *</label>
					<input type="email" class="form-control" name="email" id="emailInfo" placeholder="JohnDoe@gmail.com" required>
				</div>

				<div class="col-md-4">
					<label for="phoneNumber" class="form-label">Phone Number</label>
					<input type="text" class="form-control" name="phone" id="phoneNumber" placeholder="+1 (415) 867-5309">
				</div>

				<div class="col-md-12">
					<label for="comments" class="form-label">Share your message here!</label>
					<textarea class="form-control" id="comments,&nbsp;questions" name="comment"rows="3" required></textarea>
				</div>

				<div class="cold-md-12">
					<button type="submit" class="btn btn-submit">Submit</button>
				</div>
			</form>
		</div>
	</div>

	<div class="ard-footer">
		<div class="container-fluid">
			<div class="row">
				<ul>
					<li><a href="https://www.facebook.com/people/Ardnilak-Foundation/100068986899114/" target="_blank" rel="noopener noreferrer"><img src="Facebook_Logo_Secondary.png"></a></li>
					<li><a href="https://www.instagram.com/theardnilakfoundation/" target="_blank" rel="noopener noreferrer"><img src="Instagram_Glyph_White.png"></a></li>
				</ul>
			</div>
		</div>
	</div>





</body>
